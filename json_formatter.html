<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="img/logo_ura_tools.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter - Ura Tools</title>

  <!-- Biblioteca para geração do PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --azul: #0046A6;
      --azul-esc: #003580;
      --verde: #00A859;
      --verde-esc: #008E4A;
      --texto: #333333;
      --muted: #666666;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6ecf2 100%);
      min-height: 100vh;
      color: var(--texto);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    /* ===================== HEADER ===================== */
    .main-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 70, 166, 0.1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 20px rgba(0, 70, 166, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      transition: background 0.3s, border-color 0.3s;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .Ura-logo {
      height: 46px;
      width: auto;
    }

    .header-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0046A6;
    }

    .brand-accent {
      color: #0016a8;
      font-weight: 600;
    }

    .nav-menu {
      display: flex;
      gap: 10px;
      background: rgba(0, 70, 166, 0.05);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid rgba(0, 70, 166, 0.1);
    }

    .nav-button {
      padding: 9px 20px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      background: transparent;
      color: #0046A6;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .nav-button:hover {
      background: rgba(0, 70, 166, 0.1);
    }

    .nav-button.active {
      background: linear-gradient(135deg, #0046A6 0%, #003580 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 70, 166, 0.2);
    }

    #themeToggle {
      color: #666;
    }

    /* ===================== CONTAINER ===================== */
    .conteudo_pagina {
      padding: 0px 20px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 70, 166, 0.1);
      border-radius: 16px;
      padding: clamp(20px, 3vw, 40px);
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 70, 166, 0.08);
      margin-top: 25px;
      margin-bottom: 35px;
      transition: background 0.3s, border-color 0.3s;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1.1rem, 2vw, 1.3rem);
      font-weight: 600;
      color: #0046A6;
      margin-bottom: 8px;
    }

    .section-title::before {
      content: "{ }";
      font-family: 'Courier New', monospace;
      font-weight: 800;
      font-size: clamp(1.2rem, 2vw, 1.4rem);
      color: #00A859;
    }

    .page-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(0, 70, 166, 0.1);
    }

    /* ===================== BOTÕES ===================== */
    .json-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      font-family: inherit;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0046A6 0%, #003580 100%);
      color: white;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #00A859 0%, #008E4A 100%);
      color: white;
    }

    .btn-pdf {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: white;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 70, 166, 0.25);
      color: #0046A6;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: rgba(0, 70, 166, 0.08);
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.9);
      color: #b3261e;
      border: 1px solid rgba(179, 38, 30, 0.3);
      box-shadow: none;
      margin-left: auto;
    }

    .btn-clear:hover {
      background: rgba(179, 38, 30, 0.08);
      border-color: rgba(179, 38, 30, 0.5);
    }

    /* ===================== ÁREA DE CÓDIGO ===================== */
    .editor-wrapper {
      position: relative;
      width: 100%;
    }

    #jsonInput {
      width: 100%;
      min-height: 480px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(0, 70, 166, 0.2);
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13.5px;
      line-height: 1.55;
      resize: vertical;
      background: rgba(255, 255, 255, 0.95);
      color: #2c3e50;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      tab-size: 2;
    }

    #jsonInput:focus {
      border-color: #00A859;
      box-shadow: 0 0 0 3px rgba(0, 168, 89, 0.12);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'Courier New', monospace;
    }

    /* ===================== MENSAGENS ===================== */
    .status-msg {
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      font-size: 13.5px;
      font-weight: 500;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    /* ===================== MODO ESCURO ===================== */
    body.dark-mode {
      background: linear-gradient(135deg, #121619 0%, #1a2229 100%);
      color: #e0e0e0;
    }

    body.dark-mode .main-header {
      background: rgba(22, 28, 36, 0.95);
      border-bottom-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    body.dark-mode .header-title,
    body.dark-mode .section-title {
      color: #66a3ff;
    }

    body.dark-mode .brand-accent { color: #8cbfff; }

    body.dark-mode .nav-menu {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
    }

    body.dark-mode .nav-button:not(.active) { color: #a0a0a0; }
    body.dark-mode .nav-button:not(.active):hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    body.dark-mode #themeToggle { color: #e0e0e0; }

    body.dark-mode .container {
      background: rgba(30, 38, 46, 0.95);
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    body.dark-mode .page-desc {
      color: #9fb0c0;
      border-bottom-color: rgba(255, 255, 255, 0.07);
    }

    body.dark-mode #jsonInput {
      background: rgba(22, 28, 36, 0.95);
      border-color: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }

    body.dark-mode #jsonInput:focus {
      border-color: #00A859;
      box-shadow: 0 0 0 3px rgba(0, 168, 89, 0.2);
    }

    body.dark-mode .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.12);
      color: #8cbfff;
    }

    body.dark-mode .btn-outline:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    body.dark-mode .btn-clear {
      background: rgba(255, 255, 255, 0.05);
      color: #ff8f8a;
      border-color: rgba(255, 143, 138, 0.3);
    }

    body.dark-mode .error {
      background: rgba(220, 38, 38, 0.18);
      color: #fca5a5;
      border-color: rgba(220, 38, 38, 0.35);
    }

    body.dark-mode .success {
      background: rgba(0, 168, 89, 0.18);
      color: #86efac;
      border-color: rgba(0, 168, 89, 0.35);
    }

    body.dark-mode .meta-bar {
      color: #8899a6;
    }

    /* ===================== RESPONSIVO ===================== */
    @media (max-width: 768px) {
      .conteudo_pagina { padding: 0 12px; }
      .container { padding: 18px; margin-top: 18px; }
      .main-header { flex-direction: column; gap: 12px; }
      .nav-menu { width: 100%; justify-content: center; }
      .json-controls { flex-direction: column; }
      .action-btn { width: 100%; justify-content: center; }
      .btn-clear { margin-left: 0; }
    }
  </style>
</head>

<body>
  <!-- ===================== HEADER ===================== -->
  <header class="main-header">
    <div class="logo-container">
      <img src="img/logo_ura_tools.png" 
           alt="Ura Tools" 
           class="Ura-logo"
           title="Ura Tools">
      <div class="header-title">JSON Formatter - <span class="brand-accent">Ura Tools</span></div>
    </div>

    <nav class="nav-menu">
      <a href="index.html" class="nav-button">
        <span>🏠</span> Home
      </a>
      <a href="links_uteis.html" class="nav-button">
        <span>🔗</span> Link's Uteis
      </a>
      <button id="themeToggle" class="nav-button" type="button">
        <span id="themeIcon">🌙</span> <span id="themeText">Escuro</span>
      </button>
    </nav>
  </header>

  <!-- ===================== CONTEÚDO ===================== -->
  <main class="conteudo_pagina">
    <div class="container">
      <h1 class="section-title">Formatador JSON</h1>
      <p class="page-desc">Organize, valide, minifique e exporte seus arquivos JSON de forma simples e rápida.</p>

      <div class="json-controls">
        <button class="action-btn btn-primary" type="button" onclick="formatJSON()">
          <span>✨</span> Formatar
        </button>
        <button class="action-btn btn-secondary" type="button" onclick="copyJSON()">
          <span>📋</span> Copiar
        </button>
        <button class="action-btn btn-pdf" type="button" onclick="exportPDF()">
          <span>📄</span> Exportar PDF
        </button>
        <button class="action-btn btn-outline" type="button" onclick="minifyJSON()">
          <span>🗜️</span> Minificar
        </button>
        <button class="action-btn btn-clear" type="button" onclick="clearAll()">
          <span>🗑️</span> Limpar
        </button>
      </div>

      <div class="editor-wrapper">
        <textarea id="jsonInput" placeholder='Cole seu JSON aqui... (ex.: {"status": "ok", "pontos": [10001, 10002]})' spellcheck="false"></textarea>
        <div class="meta-bar">
          <span id="charCount">0 caracteres</span>
          <span id="lineCount">0 linhas</span>
        </div>
      </div>
      
      <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const jsonArea = document.getElementById('jsonInput');
    const statusMsg = document.getElementById('statusMsg');
    const charCount = document.getElementById('charCount');
    const lineCount = document.getElementById('lineCount');
    let timerStatus = null;

    /* ================= TEMA CLARO / ESCURO ================= */
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon   = document.getElementById('themeIcon');
      const themeText   = document.getElementById('themeText');
      const body        = document.body;

      function aplicarTema(escuro) {
        body.classList.toggle('dark-mode', escuro);
        themeIcon.textContent = escuro ? '☀️' : '🌙';
        themeText.textContent = escuro ? 'Claro' : 'Escuro';
      }

      aplicarTema(localStorage.getItem('theme') === 'dark');

      themeToggle.addEventListener('click', () => {
        const escuro = !body.classList.contains('dark-mode');
        localStorage.setItem('theme', escuro ? 'dark' : 'light');
        aplicarTema(escuro);
      });

      // Identifica menu ativo
      const currentPage = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.querySelectorAll('a.nav-button').forEach(botao => {
        const href = (botao.getAttribute('href') || '').toLowerCase();
        if (!href) return;
        botao.classList.toggle('active', href === currentPage);
      });
    });

    // Atualiza contadores de caracteres e linhas
    function updateMeta() {
      const val = jsonArea.value;
      charCount.textContent = `${val.length.toLocaleString('pt-BR')} caracteres`;
      const lines = val ? val.split('\n').length : 0;
      lineCount.textContent = `${lines.toLocaleString('pt-BR')} linhas`;
    }
    jsonArea.addEventListener('input', updateMeta);

    function showStatus(text, type) {
      clearTimeout(timerStatus);
      statusMsg.innerText = text;
      statusMsg.className = 'status-msg ' + type;
      statusMsg.style.display = 'block';
      if (type === 'success') {
        timerStatus = setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
      }
    }

    function formatJSON() {
      try {
        const rawValue = jsonArea.value.trim();
        if (!rawValue) return;
        const obj = JSON.parse(rawValue);
        jsonArea.value = JSON.stringify(obj, null, 2);
        updateMeta();
        showStatus('✓ JSON formatado e validado com sucesso!', 'success');
      } catch (e) {
        showStatus('Erro de Sintaxe JSON: ' + e.message, 'error');
      }
    }

    function minifyJSON() {
      try {
        const rawValue = jsonArea.value.trim();
        if (!rawValue) return;
        const obj = JSON.parse(rawValue);
        jsonArea.value = JSON.stringify(obj);
        updateMeta();
        showStatus('✓ JSON minificado!', 'success');
      } catch (e) {
        showStatus('Erro ao minificar: ' + e.message, 'error');
      }
    }

    function copyJSON() {
      if (!jsonArea.value.trim()) {
        showStatus('Área vazia para copiar.', 'error');
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(jsonArea.value).then(() => {
          showStatus('✓ Copiado para a área de transferência!', 'success');
        }).catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      jsonArea.select();
      try {
        document.execCommand('copy');
        showStatus('✓ Copiado para a área de transferência!', 'success');
      } catch (e) {
        showStatus('Não foi possível copiar automaticamente.', 'error');
      }
    }

    function clearAll() {
      jsonArea.value = '';
      statusMsg.style.display = 'none';
      updateMeta();
      jsonArea.focus();
    }

    /* ================= EXPORTAR PDF MULTIPÁGINAS (SEM CORTE) ================= */
    async function exportPDF() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showStatus('Biblioteca jsPDF não foi carregada. Verifique a conexão.', 'error');
        return;
      }

      const content = jsonArea.value.trim();
      if (!content) {
        showStatus('Cole um JSON antes de exportar!', 'error');
        return;
      }

      // Tenta formatar antes de exportar para garantir estética
      let jsonFormatado = content;
      try {
        jsonFormatado = JSON.stringify(JSON.parse(content), null, 2);
      } catch (e) {
        // se tiver erro de sintaxe, exporta o texto bruto mesmo
      }

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: 'a4'
        });

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const marginX = 15;
        const marginTop = 25;
        const marginBottom = 20;
        const usableWidth = pageWidth - (marginX * 2);
        const usableHeight = pageHeight - marginBottom;

        const date = new Date().toLocaleString('pt-BR');

        // Função para desenhar cabeçalho em todas as páginas
        function desenharCabecalho(doc, paginaAtual, totalPaginas) {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(14);
          doc.setTextColor(0, 70, 166);
          doc.text("Relatório JSON - Ura Tools", marginX, 12);

          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(110);
          doc.text(`Gerado em: ${date}`, marginX, 17);

          doc.setLineWidth(0.3);
          doc.setDrawColor(0, 70, 166);
          doc.line(marginX, 20, pageWidth - marginX, 20);
        }

        // Função para desenhar rodapé
        function desenharRodape(doc, paginaAtual) {
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.setTextColor(130);
          doc.text(`Página ${paginaAtual}`, pageWidth - marginX, pageHeight - 8, { align: 'right' });
          doc.text("Ura Tools • Documento confidencial interno", marginX, pageHeight - 8);
        }

        // Configura fonte do JSON
        doc.setFont("courier", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(35, 39, 42);

        // Quebra o texto em linhas que cabem exatamente na largura útil
        const linhasQuebradas = doc.splitTextToSize(jsonFormatado, usableWidth);
        const alturaLinha = 4.2; // mm entre cada linha

        let cursorY = marginTop;
        let paginaAtual = 1;

        // Primeira página: cabeçalho
        desenharCabecalho(doc, paginaAtual);

        for (let i = 0; i < linhasQuebradas.length; i++) {
          // Se a próxima linha for ultrapassar o limite inferior da folha, cria nova página
          if (cursorY + alturaLinha > usableHeight) {
            desenharRodape(doc, paginaAtual);
            doc.addPage();
            paginaAtual++;
            desenharCabecalho(doc, paginaAtual);
            doc.setFont("courier", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(35, 39, 42);
            cursorY = marginTop;
          }

          doc.text(linhasQuebradas[i], marginX, cursorY);
          cursorY += alturaLinha;
        }

        // Rodapé da última página
        desenharRodape(doc, paginaAtual);

        doc.save(`json_ura_tools_${Date.now()}.pdf`);
        showStatus(`✓ PDF exportado com sucesso! (${paginaAtual} página${paginaAtual > 1 ? 's' : ''})`, 'success');
      } catch (err) {
        console.error(err);
        showStatus('Erro ao gerar PDF: ' + err.message, 'error');
      }
    }

    // Atalho Ctrl+Enter para formatar
    jsonArea.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        formatJSON();
      }
    });
  </script>
</body>
</html>
