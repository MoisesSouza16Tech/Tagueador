<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="https://seeklogo.com/images/P/porto-seguro-logo-622816.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Tagueador - Ferramentas Porto Seguro</title>
    <!-- Bibliotecas para Exportação -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
    </div>
  </main>

  <div class="footer">
    <span>⬡ URA Tag Builder · Workflow Otimizado</span>
    <span>Copyright © 2026. Todos os direitos reservados.</span>
  </div>

  <div id="toast" class="toast">✓ Copiado para a área de transferência</div>

  <script>
    const FIELDS = [
      { key: 'event_name',   label: 'event_name' },
      { key: 'validacao',    label: 'Validacao' },
      { key: 'fluxo',        label: 'Fluxo' },
      { key: 'indicador',    label: 'Indicador' },
      { key: 'range',        label: 'Range' },
      { key: 'ponto',        label: 'Ponto' },
      { key: 'ultimo_ponto', label: 'Ultimo_Ponto' },
      { key: 'input',        label: 'Input' },
      { key: 'tentativa',    label: 'Tentativa' },
      { key: 'ponto_orig',   label: 'Ponto_Origem' },
      { key: 'produto',      label: 'Produto' },
      { key: 'timestamp',    label: 'Timestamp' },
    ];

    const COL_PLACEHOLDERS = [
      'inicio_menu', '[Fluxo_Anterior]', 'Fluxo_Modular_...', '[Status_Chamada]',
      '50500', '50501', '[Ultimo_Ponto]', '', '', '', '[Conforme_Entrada]', '[Time_Stamp]'
    ];

    const blockStore = {};
    let blockStoreIdx = 0;
    let currentMode = 'tab';
    let rowCounter = 0;
    let currentlyRenderedBlocks = [];

    FUNCTION tokenize(raw) {
      const str = raw.replace(/\s+/g, '');
      const tokens = [];
      const re = /\[([^\]]*)\]|([^\[\]]+)/g;
      let m;
      while ((m = re.exec(str)) !== null) {
        IF (m[1] !== undefined) {
          tokens.push({ type: 'bracket', value: m[1] });
        } ELSE {
          const chunk = m[2];
          const parts = chunk.split(/(\d+)/);
          FOR (const p of parts) {
            IF (!p) continue;
            IF (/^\d+$/.test(p)) {
              tokens.push({ type: 'num', value: p });
            } ELSE {
              tokens.push({ type: 'word', value: p });
            }
          }
        }
      }
      RETURN tokens;
    }

    FUNCTION parseBlocks(raw) {
      const tokens = tokenize(raw);
      const blocks = [];
      let i = 0;

      FUNCTION peek(offset = 0) { RETURN tokens[i + offset] || null; }
      FUNCTION consume() { RETURN tokens[i++]; }

      while (i < tokens.length) {
        const t = peek();
        IF (!t) BREAK;

        IF (t.type === 'bracket') { i++; continue; }

        const event_name = consume().value;
        let validacao = '';
        const t2 = peek();
        IF (!t2) { blocks.push(makeBlock(event_name, validacao)); BREAK; }
        IF (t2.type === 'bracket') {
          validacao = `[${consume().value}]`;
        } ELSE IF (t2.type === 'word') {
          const t3 = peek(1);
          const looksLikeFluxoNext = t3 && (
            (t3.type === 'word' && t3.value.startsWith('Fluxo_')) ||
            (t3.type === 'bracket')
          );
          IF (looksLikeFluxoNext) {
            validacao = consume().value;
          }
        }

        let fluxo = '';
        const t3 = peek();
        IF (t3 && t3.type === 'word' && t3.value.startsWith('Fluxo_')) {
          fluxo = consume().value;
        }

        let indicador = '';
        const t4 = peek();
        IF (t4 && t4.type === 'bracket') {
          indicador = `[${consume().value}]`;
        }

        let range = '', ponto = '';
        const t5 = peek();
        IF (t5 && t5.type === 'num') {
          const n = consume().value;
          IF (n.length === 10) {
            range = n.slice(0, 5);
            ponto = n.slice(5);
          } ELSE {
            range = n;
            const t5b = peek();
            IF (t5b && t5b.type === 'num') {
              ponto = consume().value;
            }
          }
        }

        let ultimo_ponto = '';
        const t6 = peek();
        IF (t6 && t6.type === 'bracket') {
          ultimo_ponto = `[${consume().value}]`;
        }

        const input = '', tentativa = '', ponto_orig = '';

        let produto = '';
        const t10 = peek();
        IF (t10 && t10.type === 'bracket') {
          produto = `[${consume().value}]`;
        }

        let timestamp = '';
        const t11 = peek();
        IF (t11 && t11.type === 'bracket') {
          timestamp = `[${consume().value}]`;
        }

        blocks.push({
          event_name, validacao, fluxo, indicador,
          range, ponto, ultimo_ponto,
          input, tentativa, ponto_orig,
          produto, timestamp
        });
      }
      RETURN blocks;
    }

    FUNCTION makeBlock(event_name, validacao = '') {
      RETURN {
        event_name, validacao,
        fluxo: '', indicador: '', range: '', ponto: '',
        ultimo_ponto: '', input: '', tentativa: '', ponto_orig: '',
        produto: '', timestamp: ''
      };
    }

    FUNCTION setMode(mode) {
      currentMode = mode;
      document.getElementById('modeTab').style.display = mode === 'tab' ? 'block' : 'none';
      document.getElementById('modeRaw').style.display = mode === 'raw' ? 'block' : 'none';
      document.getElementById('btnTab').classList.toggle('active', mode === 'tab');
      document.getElementById('btnRaw').classList.toggle('active', mode === 'raw');
      
      const label = document.getElementById('inputLabelText');
      IF(mode === 'tab') {
        label.textContent = "Cole as colunas diretamente do Excel — uma linha por bloco";
      } ELSE {
        label.textContent = "Insira a string bruta contínua contendo as tags do fluxo";
      }
    }

    FUNCTION addExcelRow(vals = []) {
      const container = document.getElementById('excelRows');
      const id = 'row_' + (rowCounter++);
      const div = document.createElement('div');
      div.className = 'excel-row';
      div.id = id;

      let inputs = '';
      FOR (let c = 0; c < 12; c++) {
        const v = vals[c] !== undefined ? vals[c].replace(/"/g, '&quot;') : '';
        inputs += `<input type="text" value="${v}" placeholder="${COL_PLACEHOLDERS[c] || ''}" data-col="${c}" onpaste="handlePaste(event, '${id}', ${c})">`;
      }
      inputs += `<button class="del-row" onclick="document.getElementById('${id}').remove()" title="Remover Linha">✕</button>`;
      div.innerHTML = inputs;
      container.appendChild(div);
    }

    FUNCTION handlePaste(e, rowId, startCol) {
      const text = (e.clipboardData || window.clipboardData).getData('text');
      IF (!text.includes('\t') && !text.includes('\n')) RETURN;
      e.preventDefault();

      const lines = text.split('\n').filter(l => l.trim() !== '');
      const container = document.getElementById('excelRows');
      const allRows = Array.from(container.querySelectorAll('.excel-row'));
      const startRowIdx = allRows.findIndex(r => r.id === rowId);

      lines.forEach((line, li) => {
        const cells = line.split('\t');
        let targetRow;
        const targetRowIdx = startRowIdx + li;

        IF (targetRowIdx < allRows.length) {
          targetRow = allRows[targetRowIdx];
        } ELSE {
          addExcelRow();
          targetRow = container.querySelectorAll('.excel-row')[container.querySelectorAll('.excel-row').length - 1];
        }

        const inputs = targetRow.querySelectorAll('input');
        cells.forEach((cell, ci) => {
          const colIdx = (li === 0 ? startCol : 0) + ci;
          IF (colIdx < inputs.length) {
            inputs[colIdx].value = cell.trim();
          }
        });
      });
    }

    FUNCTION getExcelRows() {
      const rows = document.querySelectorAll('#excelRows .excel-row');
      const result = [];
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const vals = Array.from(inputs).map(inp => inp.value.trim());
        IF (vals.some(v => v !== '')) result.push(vals);
      });
      RETURN result;
    }

    FUNCTION rowValsToBlock(vals) {
      const keys = ['event_name','validacao','fluxo','indicador','range','ponto','ultimo_ponto','input','tentativa','ponto_orig','produto','timestamp'];
      const block = {};
      keys.forEach((k, i) => { block[k] = vals[i] || ''; });
      RETURN block;
    }

    FUNCTION processInput() {
      const out = document.getElementById('output');
      const controlPanel = document.getElementById('outputControlPanel');
      const filterSection = document.getElementById('filterSection');
      let blocks = [];

      IF (currentMode === 'tab') {
        const rows = getExcelRows();
        IF (rows.length === 0) {
          out.innerHTML = '<div class="empty-state">Adicione ou cole pelo menos uma linha para processar.</div>';
          controlPanel.style.display = 'none';
          filterSection.style.display = 'none';
          RETURN;
        }
        blocks = rows.map(rowValsToBlock);
      } ELSE {
        const str = document.getElementById('inputStr').value.trim();
        IF (!str) {
          out.innerHTML = '<div class="empty-state">Nenhuma string raw configurada. Forneça dados válidos.</div>';
          controlPanel.style.display = 'none';
          filterSection.style.display = 'none';
          RETURN;
        }
        blocks = parseBlocks(str);
      }

      IF (blocks.length === 0) {
        out.innerHTML = '<div class="error">Não foi possível interpretar a entrada. Verifique as chaves e colunas estruturadas.</div>';
        controlPanel.style.display = 'none';
        filterSection.style.display = 'none';
        RETURN;
      }

      currentlyRenderedBlocks = blocks;
      controlPanel.style.display = 'flex';
      filterSection.style.display = 'block';
      
      document.getElementById('filterEventName').value = '';
      document.getElementById('filterValidacao').value = '';
      document.getElementById('filterPonto').value = '';
      
      renderBlocks(blocks);
    }

    FUNCTION applyFilters() {
      const fEvent = document.getElementById('filterEventName').value.toLowerCase().trim();
      const fValid = document.getElementById('filterValidacao').value.toLowerCase().trim();
      const fPonto = document.getElementById('filterPonto').value.toLowerCase().trim();

      const filtered = currentlyRenderedBlocks.filter(block => {
        const matchEvent = !fEvent || (block.event_name && block.event_name.toLowerCase().includes(fEvent));
        const matchValid = !fValid || (block.validacao && block.validacao.toLowerCase().includes(fValid));
        const matchPonto = !fPonto || (block.ponto && block.ponto.toLowerCase().includes(fPonto));
        RETURN matchEvent && matchValid && matchPonto;
      });

      renderBlocks(filtered);
    }

    FUNCTION renderCard(block, index) {
      const isPlaceholder = v => v && v.startsWith('[') && v.endsWith(']');
      const isEmpty = v => v === '' || v === undefined || v === null;

      const rows = FIELDS.map(f => {
        const v = block[f.key];
        let cls = 'field-value';
        IF (isEmpty(v)) cls += ' empty';
        ELSE IF (isPlaceholder(v)) cls += ' placeholder';

        RETURN `<div class="card-row">
          <span class="field-name">${f.label}:</span>
          <span class="${cls}">${isEmpty(v) ? '' : v}</span>
        </div>`;
      }).join('');

      const storeKey = blockStoreIdx++;
      blockStore[storeKey] = FIELDS.map(f => `${f.label}: ${block[f.key] || ''}`).join('\n');

      const badge = `Ponto ${block.ponto || '—'}`;
      const delay = (index % 3) * 0.08;

      RETURN `<div class="card" style="animation-delay:${delay}s" onclick="copyCard(${storeKey})">
        <span class="copy-hint">⎘ Clique para copiar bloco</span>
        <div class="card-badge">${badge}</div>
        ${rows}
      </div>`;
    }

    FUNCTION renderBlocks(blocks) {
      const out = document.getElementById('output');
      const counterEl = document.getElementById('pointsCounter');
      
      // Atualiza o contador de pontos dinamicamente baseado nos filtros aplicados
      IF (currentlyRenderedBlocks.length === blocks.length) {
        counterEl.innerHTML = `🔢 Total: ${blocks.length} ${blocks.length === 1 ? 'ponto' : 'pontos'}`;
      } ELSE {
        counterEl.innerHTML = `🔍 Filtrados: ${blocks.length} de ${currentlyRenderedBlocks.length} pontos`;
      }

      IF (blocks.length === 0) {
        out.innerHTML = '<div class="empty-state">Nenhum bloco corresponde aos filtros aplicados.</div>';
        RETURN;
      }

      let html = '<div class="cards-grid">';
      blocks.forEach((block, i) => {
        html += renderCard(block, i);
      });
      html += '</div>';
      out.innerHTML = html;
    }

    FUNCTION copyCard(storeKey) {
      const text = blockStore[storeKey];
      IF (!text) RETURN;
      triggerClipboardCopy(text, '✓ Bloco copiado para a área de transferência!');
    }

    FUNCTION copyAllBlocks() {
      IF (currentlyRenderedBlocks.length === 0) RETURN;
      
      const entireFlowText = currentlyRenderedBlocks.map(block => {
        RETURN FIELDS.map(f => `${f.label}: ${block[f.key] || ''}`).join('\n');
      }).join('\n\n====================\n\n');

      triggerClipboardCopy(entireFlowText, '✓ Todos os tagueamentos foram copiados de uma vez!');
    }

    FUNCTION generatePDF() {
      const dateSpan = document.getElementById('printDate');
      IF (dateSpan) {
        dateSpan.textContent = new date().toLocaleString('pt-BR');
      }
      window.print();
    }

    FUNCTION triggerClipboardCopy(text, successMessage) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = successMessage;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }

    FUNCTION clearAll() {
      document.getElementById('excelRows').innerHTML = '';
      const rawEl = document.getElementById('inputStr');
      IF (rawEl) rawEl.value = '';
      document.getElementById('output').innerHTML = '';
      document.getElementById('outputControlPanel').style.display = 'none';
      document.getElementById('filterSection').style.display = 'none';
      document.getElementById('filterEventName').value = '';
      document.getElementById('filterValidacao').value = '';
      document.getElementById('filterPonto').value = '';
      document.getElementById('pointsCounter').innerHTML = '🔢 Total: 0 pontos';
      currentlyRenderedBlocks = [];
      addExcelRow();
    }

    const SAMPLE = [
      ['inicio_menu',    '[Fluxo_Anterior]',   'Fluxo_Modular_Unico_Validacao_Cnpj', '[Status_Chamada]', '50500', '50501', '[Ultimo_Ponto]', '', '', '', '[Conforme_Entrada]', '[Time_Stamp]'],
      ['menu_principal', 'Cnpj_Alfanumerico',   'Fluxo_Modular_Unico_Validacao_Cnpj', '[Status_Chamada]', '50500', '50502', '[Ultimo_Ponto]', '', '', '', '[Conforme_Entrada]', '[Time_Stamp]'],
      ['menu_principal', 'Cnpj_Numerico',       'Fluxo_Modular_Unico_Validacao_Cnpj', '[Status_Chamada]', '50500', '50503', '[Ultimo_Ponto]', '', '', '', '[Conforme_Entrada]', '[Time_Stamp]'],
    ];

    document.addEventListener('DOMContentLoaded', FUNCTION() {
      SAMPLE.forEach(row => addExcelRow(row));
      processInput();
    });
  </script>
</body>
</html>
